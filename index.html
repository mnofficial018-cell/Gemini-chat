<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI সহকারী</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c1e21; --muted:#6b7280; --user:#2563eb; --user-text:#fff; --bot:#e8eaee; --border:#d9dce1; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111317; --card:#1b1e24; --text:#e8eaed; --muted:#9aa0a6; --user:#3b82f6; --user-text:#fff; --bot:#2a2e36; --border:#333842; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: system-ui, "Noto Sans Bengali", sans-serif; display: flex; flex-direction: column; }
  header { padding: 14px 16px; background: var(--card); border-bottom: 1px solid var(--border); font-weight: 600; display:flex; justify-content:space-between; align-items:center; }
  header button { background:none; border:1px solid var(--border); color:var(--muted); border-radius:8px; padding:4px 10px; font-size:13px; cursor:pointer; }
  #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; max-width: 760px; width: 100%; margin: 0 auto; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 16px; line-height: 1.55; white-space: pre-wrap; word-wrap: break-word; }
  .user { align-self: flex-end; background: var(--user); color: var(--user-text); border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
  .bot.error { color: #dc2626; }
  .hint { color: var(--muted); text-align: center; margin-top: 30px; }
  form { display: flex; gap: 8px; padding: 12px 16px; background: var(--card); border-top: 1px solid var(--border); max-width: 760px; width: 100%; margin: 0 auto; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
  textarea { flex: 1; resize: none; border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; font: inherit; background: var(--bg); color: var(--text); max-height: 140px; }
  #send { border: none; background: var(--user); color: #fff; border-radius: 12px; padding: 0 18px; font: inherit; font-weight: 600; cursor: pointer; }
  #send:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header><span>AI সহকারী</span><button id="clear" type="button">নতুন চ্যাট</button></header>
<div id="chat"><div class="hint" id="hint">যা খুশি জিজ্ঞেস করুন।</div></div>
<form id="form">
  <textarea id="input" rows="1" placeholder="আপনার প্রশ্ন লিখুন..." autocomplete="off"></textarea>
  <button id="send" type="submit">পাঠান</button>
</form>
<script>
  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  let history = [];
  let busy = false;

  function addMsg(text, cls) {
    const hint = document.getElementById("hint");
    if (hint) hint.remove();
    const el = document.createElement("div");
    el.className = "msg " + cls;
    el.textContent = text;
    chat.appendChild(el);
    chat.scrollTop = chat.scrollHeight;
    return el;
  }

  async function send() {
    const text = input.value.trim();
    if (!text || busy) return;
    busy = true; sendBtn.disabled = true;
    input.value = ""; input.style.height = "auto";
    addMsg(text, "user");
    history.push({ role: "user", content: text });
    const wait = addMsg("...", "bot");
    try {
      const res = await fetch("/.netlify/functions/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history }),
      });
      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data.error || "সমস্যা হয়েছে");
      wait.textContent = data.reply;
      history.push({ role: "assistant", content: data.reply });
    } catch (e) {
      wait.textContent = e.message || "সমস্যা হয়েছে, আবার চেষ্টা করুন।";
      wait.classList.add("error");
      history.pop();
    }
    busy = false; sendBtn.disabled = false;
    chat.scrollTop = chat.scrollHeight;
    input.focus();
  }

  form.addEventListener("submit", (e) => { e.preventDefault(); send(); });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && window.innerWidth > 700) { e.preventDefault(); send(); }
  });
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 140) + "px";
  });
  document.getElementById("clear").addEventListener("click", () => {
    history = [];
    chat.innerHTML = '<div class="hint" id="hint">যা খুশি জিজ্ঞেস করুন।</div>';
  });
</script>
</body>
</html>
